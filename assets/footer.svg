<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">
<defs>
<style>
text{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}
.cmd{fill:#7EE787;font-size:24px}
.msg{fill:#E5E7EB;font-size:26px}
.small{fill:#A1A1AA;font-size:20px}
.glow{fill:#C084FC}
</style>
<filter id="g">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<rect width="1600" height="320" rx="18" fill="#0B0F17"/>
<rect x="8" y="8" width="1584" height="304" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2"/>

<circle cx="38" cy="36" r="8" fill="#ff5f57"/>
<circle cx="66" cy="36" r="8" fill="#febc2e"/>
<circle cx="94" cy="36" r="8" fill="#28c840"/>

<text x="30" y="80" class="cmd">PS C:\Users\KARAN&gt; exit</text>

<text x="30" y="145" class="msg">Session terminated successfully.</text>
<text x="30" y="190" class="msg">Thanks for visiting my profile.</text>
<text x="30" y="225" class="small">See you in the next commit.</text>

<g filter="url(#g)">
<circle cx="1460" cy="90" r="3" class="glow">
<animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="1510" cy="150" r="2" class="glow">
<animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="1420" cy="220" r="4" class="glow">
<animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
</circle>
</g>

<text x="30" y="285" class="cmd">PS C:\Users\KARAN&gt;<animate attributeName="opacity" values="1;1;1" dur="0.1s"/></text>

</svg>
